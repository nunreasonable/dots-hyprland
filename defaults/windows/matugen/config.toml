# Windows matugen config, passed to matugen.exe with `-c`. ii only needs the Material You color
# JSON here (MaterialThemeLoader.qml reads it through a FileView) - the Linux config
# (~/.config/matugen/config.toml) also renders terminal/GTK/KDE/Hyprland templates that have no
# Windows equivalent yet.
#
# `input_path` is relative to this file's own directory (matugen resolves template paths against
# the config file's location, not the process's working directory - see InioX/matugen's
# src/template.rs / the resolve-path crate), so it travels with this file wherever it's deployed.
#
# `output_path` has to stay an absolute path: matugen.exe's `--prefix` flag is compiled out on
# Windows (same source file), and it must keep matching
# Directories.generatedMaterialThemePath in ii/modules/common/Directories.qml
# (StandardPaths.StateLocation, which Qt resolves to %LOCALAPPDATA%\quickshell on Windows -
# assuming the default, unredirected AppData location, same assumption the Linux config makes
# about ~/.config and ~/.local/state).
[config]
version_check = false

[templates.m3colors]
input_path = 'colors.json'
output_path = '~/AppData/Local/quickshell/user/generated/colors.json'
