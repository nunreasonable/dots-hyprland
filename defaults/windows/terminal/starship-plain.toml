# Fallback for a classic console (conhost) that can't show starship.toml's Nerd Font glyphs -
# same layout, colors and module choices, every glyph swapped for a plain ASCII stand-in so it
# renders correctly even on the raster "Terminal" font. profile.ps1 picks this one instead of
# starship.toml when it can't get Nerd Font glyphs onto the console (see the comment there).
# Keep in sync with starship.toml's structure when that one changes; only the glyphs differ.

# Don't print a new line at the start of the prompt
add_newline = false

format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:245'

# Replace the "❯" symbol in the prompt with a plain ">"
[character]
success_symbol = "[>](bold fg:243)"
error_symbol = "[x](bold fg:244)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg: 252"
symbol = "git:"
truncation_length = 12
truncation_symbol = ""
format = " [](bold fg:252)[$symbol $branch(:$remote_branch)](fg:235 bg:252)[ ](bold fg:252)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[PICK](bold red)"

[git_status]
conflicted = " conflict "
ahead = " ahead "
behind = " behind "
diverged = " diverged "
untracked = " untracked "
stashed = " stash "
modified = " modified "
staged = '[++\($count\)](green)'
renamed = " renamed "
deleted = " deleted "

[hostname]
ssh_only = false
format = "[-$hostname](bg:252 bold fg:235)[](bold fg:252)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = "mem "
style = "bold dimmed green"

[time]
disabled = true
format = '[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:252 fg:235"
style_root = "red bold"
format = "[](bold fg:252)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = "~"
read_only = " ro "
style = "bg:255 fg:240"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:255)[-> $path]($style)[](bold fg:255)'

# No [directory.substitutions]: the icon substitutions in starship.toml are themselves
# non-ASCII (box/folder pictographs), so the plain preset just shows the real folder names.

[cmd_duration]
min_time = 0
format = '[](bold fg:252)[$duration](bold bg:252 fg:235)[](bold fg:252)'
